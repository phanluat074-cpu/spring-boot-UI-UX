# Profile "test": H2 in-memory thay SQL Server cho ki\u00e1\u00bb\u0083m th\u00e1\u00bb\u00ad t\u00c3\u00adch h\u00e1\u00bb\u00a3p
spring.datasource.url=jdbc:h2:mem:itdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server.port=8115
app.admin.username=itadmin
app.admin.password=itsecret
