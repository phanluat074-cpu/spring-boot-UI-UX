<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Đăng nhập Admin</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">
<div class="container py-5">
	<div class="row justify-content-center">
		<div class="col-md-5 col-lg-4">
			<div class="card">
				<div class="card-body p-4">
					<h1 class="h5 mb-3">Đăng nhập Admin</h1>
					<div th:if="${param.error}" class="alert alert-danger py-2">Sai tài khoản hoặc mật khẩu.</div>
					<div th:if="${param.logout}" class="alert alert-success py-2">Bạn đã đăng xuất.</div>
					<form method="post" action="/login">
						<div class="mb-2">
							<label class="form-label">Username</label>
							<input class="form-control" name="username" required>
						</div>
						<div class="mb-3">
							<label class="form-label">Password</label>
							<input class="form-control" type="password" name="password" required>
						</div>
						<button class="btn btn-primary w-100">Đăng nhập</button>
					</form>
					<a href="/" class="btn btn-link w-100 mt-2">Về trang chủ</a>
				</div>
			</div>
		</div>
	</div>
</div>
</body>
</html>
