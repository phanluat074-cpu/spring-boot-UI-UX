<!DOCTYPE html>
<html class="dark" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta content="width=device-width, initial-scale=1.0" name="viewport">
	<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
	<style>
		.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
		body { background-color: #101014; color: #F1F1F4; }
	</style>
	<script>
		tailwind.config = {
			darkMode: "class",
			theme: {
				extend: {
					colors: {
						"text-secondary": "#8A8F98",
						"text-primary": "#F1F1F4",
						"border-subtle": "#2C2C3A",
						"background-app": "#101014",
						"background": "#121319",
						"surface-container-low": "#1b1b22",
						"surface-container": "#1f1f26",
						"surface-variant": "#34343b",
						"primary": "#bdc2ff",
						"primary-container": "#5e6ad2",
						"on-primary-container": "#fdfaff"
					}
				}
			}
		}
	</script>
	<title>Danh sách bài học</title>
</head>
<body class="bg-background-app text-text-primary min-h-screen">
<header class="flex justify-between items-center w-full px-6 h-12 fixed top-0 bg-background border-b border-border-subtle z-50">
	<div class="flex items-center gap-4">
		<a href="/" class="text-primary font-bold">OpenLearning</a>
		<span class="text-xs text-text-secondary">/</span>
		<span class="text-sm text-text-secondary" th:text="${danhMuc != null ? danhMuc.tenDanhMuc : 'Danh mục'}">Danh mục</span>
	</div>
	<a href="/" class="text-sm bg-primary-container text-on-primary-container px-3 py-1 rounded">Trang chủ</a>
</header>

<main class="pt-16 pb-8 px-8 max-w-7xl mx-auto">
	<div class="mb-8">
		<h1 class="text-3xl font-bold" th:text="${danhMuc != null ? danhMuc.tenDanhMuc : 'Danh sách bài học'}">Danh sách bài học</h1>
		<p class="text-text-secondary mt-2">
			Tổng số bài học:
			<span class="font-semibold text-text-primary" th:text="${#lists.size(baiHocs)}">0</span>
		</p>
	</div>

	<div th:if="${#lists.isEmpty(baiHocs)}" class="bg-surface-container border border-border-subtle rounded-xl p-8 text-center">
		<p class="text-text-secondary">Chưa có bài học trong danh mục này.</p>
	</div>

	<div th:unless="${#lists.isEmpty(baiHocs)}" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
		<a th:each="b,iter : ${baiHocs}" th:href="@{/baihoc/{id}(id=${b.maBH})}"
		   class="group relative flex flex-col h-[420px] bg-[#E4E4E7] rounded-xl overflow-hidden transition-all hover:-translate-y-1 hover:shadow-xl cursor-pointer">
			<div class="h-1/2 overflow-hidden bg-white/40">
				<img th:if="${b.hinhAnh != null and (#strings.startsWith(b.hinhAnh, 'http://') or #strings.startsWith(b.hinhAnh, 'https://'))}"
					 th:src="${b.hinhAnh}"
					 th:alt="${b.tenBH}"
					 class="w-full h-full object-cover grayscale opacity-80 group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-500">
				<img th:unless="${b.hinhAnh != null and (#strings.startsWith(b.hinhAnh, 'http://') or #strings.startsWith(b.hinhAnh, 'https://'))}"
					 src="https://images.unsplash.com/photo-1558655146-9f40138edfeb?q=80&w=1200&auto=format&fit=crop"
					 alt="Lesson image"
					 class="w-full h-full object-cover grayscale opacity-80 group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-500">
			</div>
			<div class="p-6 flex flex-col flex-1 justify-between text-[#18181B]">
				<div>
					<span class="text-[11px] font-bold uppercase tracking-wider text-[#71717A]"
						  th:text="'Mô-đun ' + ${iter.index + 1}">Mô-đun 01</span>
					<h3 class="text-[22px] font-extrabold leading-tight mt-1" th:text="${b.tenBH}">Tên bài học</h3>
					<p class="text-sm text-[#52525B] mt-2 line-clamp-3" th:text="${b.noiDungBH}">Mô tả bài học</p>
				</div>
				<div class="flex items-center justify-between">
					<span class="text-xs font-semibold text-[#334155]">Xem bài học</span>
					<span class="material-symbols-outlined">arrow_forward</span>
				</div>
			</div>
		</a>
	</div>
</main>
</body>
</html>
