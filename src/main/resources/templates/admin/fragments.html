<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body>
<!-- Thanh Admin: menu, đếm bản ghi (khi có phân trang), đăng xuất -->
<div th:fragment="adminToolbar" class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
	<div class="d-flex gap-2 align-items-center flex-wrap">
		<a class="btn btn-sm btn-outline-secondary" href="/admin">← Menu Admin</a>
		<span class="badge text-bg-secondary" th:if="${resultPage != null}"
			  th:text="|${resultPage.totalElements} bản ghi|">0</span>
	</div>
	<div class="d-flex gap-2">
		<a class="btn btn-sm btn-outline-primary" href="/">Trang chủ</a>
		<a class="btn btn-sm btn-outline-danger" href="/logout">Đăng xuất</a>
	</div>
</div>
</body>
</html>
