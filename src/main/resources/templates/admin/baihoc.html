<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Admin - Bài học</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h1 class="h4 mb-0">Quản lý Bài học</h1>
		<a href="/admin" class="btn btn-outline-secondary">Menu Admin</a>
	</div>
	<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
	<div class="row g-4">
		<div class="col-lg-4">
			<div class="card"><div class="card-body">
				<h2 class="h6">Thêm / Sửa</h2>
				<form method="post" action="/admin/baihoc/save">
					<input type="hidden" name="maBH" th:value="${form.maBH}">
					<div class="mb-2"><label class="form-label">Tên bài học</label><input class="form-control" name="tenBH" th:value="${form.tenBH}" required></div>
					<div class="mb-2"><label class="form-label">Nội dung</label><textarea class="form-control" name="noiDungBH" rows="3" required th:text="${form.noiDungBH}"></textarea></div>
					<div class="mb-2"><label class="form-label">Link URL</label><input class="form-control" name="linkURL" th:value="${form.linkURL}"></div>
					<div class="mb-2"><label class="form-label">Hình ảnh</label><input class="form-control" name="hinhAnh" th:value="${form.hinhAnh}"></div>
					<div class="mb-3">
						<label class="form-label">Danh mục</label>
						<select class="form-select" name="maDM" required>
							<option value="">-- Chọn --</option>
							<option th:each="dm : ${danhMucs}" th:value="${dm.maDM}" th:selected="${form.maDM == dm.maDM}" th:text="${dm.tenDanhMuc}"></option>
						</select>
					</div>
					<button class="btn btn-primary">Lưu</button>
					<a href="/admin/baihoc" class="btn btn-light">Mới</a>
				</form>
			</div></div>
		</div>
		<div class="col-lg-8">
			<table class="table table-bordered table-hover">
				<thead><tr><th>MaBH</th><th>Tên</th><th>MaDM</th><th></th></tr></thead>
				<tbody>
				<tr th:each="i : ${items}">
					<td th:text="${i.maBH}"></td>
					<td th:text="${i.tenBH}"></td>
					<td th:text="${i.maDM}"></td>
					<td class="text-nowrap">
						<a class="btn btn-sm btn-warning" th:href="@{/admin/baihoc(editId=${i.maBH})}">Sửa</a>
						<form th:action="@{/admin/baihoc/{id}/delete(id=${i.maBH})}" method="post" class="d-inline">
							<button class="btn btn-sm btn-danger" onclick="return confirm('Xóa bài học này?')">Xóa</button>
						</form>
					</td>
				</tr>
				</tbody>
			</table>
		</div>
	</div>
</div>
</body>
</html>
