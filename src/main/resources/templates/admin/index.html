<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Admin Menu</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<div class="container py-4">
	<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
		<span class="text-secondary small">Đã đăng nhập Admin</span>
		<div class="d-flex gap-2">
			<a class="btn btn-sm btn-outline-light" href="/">Trang chủ</a>
			<a class="btn btn-sm btn-outline-danger" href="/logout">Đăng xuất</a>
		</div>
	</div>
	<h1 class="h3 mb-4">Admin Menu</h1>
	<div class="row g-3">
		<div class="col-md-4">
			<a class="btn btn-outline-light w-100" href="/admin/danhmuc">Quản lý Danh mục</a>
		</div>
		<div class="col-md-4"><a class="btn btn-outline-light w-100" href="/admin/baihoc">Quản lý Bài học</a></div>
		<div class="col-md-4"><a class="btn btn-outline-light w-100" href="/admin/tracnghiem">Quản lý Trắc nghiệm</a></div>
		<div class="col-md-4"><a class="btn btn-outline-light w-100" href="/admin/dapan">Quản lý Đáp án</a></div>
		<div class="col-md-4"><a class="btn btn-outline-light w-100" href="/admin/tainguyen">Quản lý Tài nguyên</a></div>
		<div class="col-md-4"><a class="btn btn-outline-light w-100" href="/admin/lab">Quản lý Interactive Lab</a></div>
	</div>
	<div class="mt-4 d-flex flex-wrap gap-2">
		<a href="/" class="btn btn-primary">Về trang chủ</a>
		<a href="/logout" class="btn btn-outline-danger">Đăng xuất</a>
	</div>
	<p class="text-secondary small mt-3 mb-0">Các trang quản lý hỗ trợ tìm kiếm, lọc và phân trang danh sách.</p>
</div>
</body>
</html>
