<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Admin - Đáp án</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h1 class="h4 mb-0">Quản lý Đáp án</h1>
		<a href="/admin" class="btn btn-outline-secondary">Menu Admin</a>
	</div>
	<div class="row g-4">
		<div class="col-lg-4">
			<div class="card"><div class="card-body">
				<h2 class="h6">Thêm / Sửa</h2>
				<form method="post" action="/admin/dapan/save">
					<input type="hidden" name="maDA" th:value="${form.maDA}">
					<div class="mb-2"><label class="form-label">Nội dung đáp án</label><textarea class="form-control" name="noiDungDapAn" rows="3" required th:text="${form.noiDungDapAn}"></textarea></div>
					<div class="mb-2 form-check">
						<input id="isCorrect" class="form-check-input" type="checkbox" name="isCorrect" th:checked="${form.isCorrect}">
						<label class="form-check-label" for="isCorrect">Đáp án đúng</label>
					</div>
					<div class="mb-3">
						<label class="form-label">Câu hỏi (MaTN)</label>
						<select class="form-select" name="maTN" required>
							<option value="">-- Chọn --</option>
							<option th:each="tn : ${tracNghiems}" th:value="${tn.maTN}" th:selected="${form.maTN == tn.maTN}" th:text="${tn.maTN + ' - ' + tn.noiDungCauHoi}"></option>
						</select>
					</div>
					<button class="btn btn-primary">Lưu</button>
					<a href="/admin/dapan" class="btn btn-light">Mới</a>
				</form>
			</div></div>
		</div>
		<div class="col-lg-8">
			<table class="table table-bordered table-hover">
				<thead><tr><th>MaDA</th><th>Nội dung</th><th>IsCorrect</th><th>MaTN</th><th></th></tr></thead>
				<tbody>
				<tr th:each="i : ${items}">
					<td th:text="${i.maDA}"></td>
					<td th:text="${i.noiDungDapAn}"></td>
					<td th:text="${i.isCorrect}"></td>
					<td th:text="${i.maTN}"></td>
					<td class="text-nowrap">
						<a class="btn btn-sm btn-warning" th:href="@{/admin/dapan(editId=${i.maDA})}">Sửa</a>
						<form th:action="@{/admin/dapan/{id}/delete(id=${i.maDA})}" method="post" class="d-inline">
							<button class="btn btn-sm btn-danger" onclick="return confirm('Xóa đáp án này?')">Xóa</button>
						</form>
					</td>
				</tr>
				</tbody>
			</table>
		</div>
	</div>
</div>
</body>
</html>
