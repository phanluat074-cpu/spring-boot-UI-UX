<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Admin - Danh mục</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h1 class="h4 mb-0">Quản lý Danh mục</h1>
		<a href="/admin" class="btn btn-outline-secondary">Menu Admin</a>
	</div>
	<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
	<div class="row g-4">
		<div class="col-lg-4">
			<div class="card">
				<div class="card-body">
					<h2 class="h6">Thêm / Sửa</h2>
					<form method="post" action="/admin/danhmuc/save">
						<input type="hidden" name="maDM" th:value="${form.maDM}">
						<div class="mb-2">
							<label class="form-label">Tên danh mục</label>
							<input class="form-control" name="tenDanhMuc" th:value="${form.tenDanhMuc}" required>
						</div>
						<div class="mb-3">
							<label class="form-label">Icon URL</label>
							<input class="form-control" name="iconURL" th:value="${form.iconURL}">
						</div>
						<button class="btn btn-primary">Lưu</button>
						<a href="/admin/danhmuc" class="btn btn-light">Mới</a>
					</form>
				</div>
			</div>
		</div>
		<div class="col-lg-8">
			<table class="table table-bordered table-hover">
				<thead>
				<tr><th>MaDM</th><th>Tên</th><th>Icon</th><th></th></tr>
				</thead>
				<tbody>
				<tr th:each="i : ${items}">
					<td th:text="${i.maDM}"></td>
					<td th:text="${i.tenDanhMuc}"></td>
					<td class="text-break" th:text="${i.iconURL}"></td>
					<td class="text-nowrap">
						<a class="btn btn-sm btn-warning" th:href="@{/admin/danhmuc(editId=${i.maDM})}">Sửa</a>
						<form th:action="@{/admin/danhmuc/{id}/delete(id=${i.maDM})}" method="post" class="d-inline">
							<button class="btn btn-sm btn-danger" onclick="return confirm('Xóa danh mục này?')">Xóa</button>
						</form>
					</td>
				</tr>
				</tbody>
			</table>
		</div>
	</div>
</div>
</body>
</html>
