<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Admin - Trắc nghiệm</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h1 class="h4 mb-0">Quản lý Trắc nghiệm</h1>
		<a href="/admin" class="btn btn-outline-secondary">Menu Admin</a>
	</div>
	<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
	<div class="row g-4">
		<div class="col-lg-4">
			<div class="card"><div class="card-body">
				<h2 class="h6">Thêm / Sửa</h2>
				<form method="post" action="/admin/tracnghiem/save">
					<input type="hidden" name="maTN" th:value="${form.maTN}">
					<div class="mb-2"><label class="form-label">Nội dung câu hỏi</label><textarea class="form-control" name="noiDungCauHoi" rows="3" required th:text="${form.noiDungCauHoi}"></textarea></div>
					<div class="mb-2"><label class="form-label">Lời giải thích</label><textarea class="form-control" name="loiGiaiThich" rows="3" required th:text="${form.loiGiaiThich}"></textarea></div>
					<div class="mb-3">
						<label class="form-label">Bài học</label>
						<select class="form-select" name="maBH" required>
							<option value="">-- Chọn --</option>
							<option th:each="bh : ${baiHocs}" th:value="${bh.maBH}" th:selected="${form.maBH == bh.maBH}" th:text="${bh.tenBH}"></option>
						</select>
					</div>
					<button class="btn btn-primary">Lưu</button>
					<a href="/admin/tracnghiem" class="btn btn-light">Mới</a>
				</form>
			</div></div>
		</div>
		<div class="col-lg-8">
			<table class="table table-bordered table-hover">
				<thead><tr><th>MaTN</th><th>Câu hỏi</th><th>MaBH</th><th></th></tr></thead>
				<tbody>
				<tr th:each="i : ${items}">
					<td th:text="${i.maTN}"></td>
					<td th:text="${i.noiDungCauHoi}"></td>
					<td th:text="${i.maBH}"></td>
					<td class="text-nowrap">
						<a class="btn btn-sm btn-warning" th:href="@{/admin/tracnghiem(editId=${i.maTN})}">Sửa</a>
						<form th:action="@{/admin/tracnghiem/{id}/delete(id=${i.maTN})}" method="post" class="d-inline">
							<button class="btn btn-sm btn-danger" onclick="return confirm('Xóa câu hỏi này?')">Xóa</button>
						</form>
					</td>
				</tr>
				</tbody>
			</table>
		</div>
	</div>
</div>
</body>
</html>
